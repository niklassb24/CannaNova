<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0752f"/>
      <stop offset="18%" stop-color="#e9b86a"/>
      <stop offset="40%" stop-color="#8f5a24"/>
      <stop offset="62%" stop-color="#c9903f"/>
      <stop offset="100%" stop-color="#5f3b18"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a4a1c"/>
      <stop offset="100%" stop-color="#4a2c10"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a26"/>
      <stop offset="50%" stop-color="#54524a"/>
      <stop offset="100%" stop-color="#1c1c19"/>
    </linearGradient>
  </defs>

  <!-- bottle body -->
  <rect x="70" y="70" width="60" height="100" rx="10" fill="url(#glassBody)"/>
  <!-- liquid fill line -->
  <rect x="74" y="130" width="52" height="36" rx="6" fill="url(#liquid)" opacity="0.85"/>

  <!-- shoulder / neck -->
  <path d="M82 70 L82 50 C 82 46, 86 44, 90 44 L110 44 C 114 44, 118 46, 118 50 L118 70 Z" fill="url(#glassBody)"/>

  <!-- dropper cap -->
  <rect x="84" y="20" width="32" height="26" rx="4" fill="url(#cap)"/>
  <rect x="96" y="6" width="8" height="18" rx="3" fill="#3a3a34"/>

  <!-- glass highlight -->
  <rect x="78" y="76" width="8" height="86" rx="4" fill="#f4dca2" opacity="0.35"/>

  <!-- label -->
  <rect x="76" y="98" width="48" height="26" rx="2" fill="#eee7d6" opacity="0.92"/>
  <line x1="82" y1="106" x2="118" y2="106" stroke="#8a6a3a" stroke-width="1.6"/>
  <line x1="82" y1="112" x2="110" y2="112" stroke="#8a6a3a" stroke-width="1.2" opacity="0.7"/>
  <line x1="82" y1="117" x2="114" y2="117" stroke="#8a6a3a" stroke-width="1.2" opacity="0.7"/>
</svg>
