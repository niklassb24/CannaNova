<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hashTop" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#c99356"/>
      <stop offset="45%" stop-color="#93602f"/>
      <stop offset="100%" stop-color="#4d3018"/>
    </linearGradient>
    <linearGradient id="hashSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4223"/>
      <stop offset="100%" stop-color="#33200f"/>
    </linearGradient>
    <linearGradient id="hashShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d9ab" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f2d9ab" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- pressed block, slight 3/4 view -->
  <polygon points="46,70 150,52 168,70 168,128 150,146 46,146" fill="url(#hashSide)"/>
  <polygon points="46,70 150,52 168,70 64,88" fill="url(#hashTop)"/>
  <polygon points="46,70 64,88 64,146 46,146" fill="#291809"/>

  <!-- pressed texture lines on top face -->
  <g stroke="#3a2410" stroke-width="1" opacity="0.5">
    <line x1="70" y1="83" x2="152" y2="66"/>
    <line x1="78" y1="85" x2="160" y2="68"/>
    <line x1="86" y1="87" x2="164" y2="70"/>
  </g>

  <!-- corner crumble -->
  <path d="M150 52 C 156 58, 160 64, 168 70 C 160 72, 152 68, 148 60 Z" fill="#7a4e28" opacity="0.8"/>
  <circle cx="176" cy="78" r="5" fill="url(#hashTop)"/>
  <circle cx="182" cy="92" r="3.2" fill="#6a4223"/>

  <!-- shine -->
  <polygon points="46,70 150,52 168,70 64,88" fill="url(#hashShine)"/>
</svg>
