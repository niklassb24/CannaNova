<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c483d"/>
      <stop offset="22%" stop-color="#cdc4a4"/>
      <stop offset="45%" stop-color="#8c8266"/>
      <stop offset="70%" stop-color="#b9b09b"/>
      <stop offset="100%" stop-color="#3a3730"/>
    </linearGradient>
    <radialGradient id="metalTop" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2dabc"/>
      <stop offset="55%" stop-color="#9b9276"/>
      <stop offset="100%" stop-color="#5c5644"/>
    </radialGradient>
  </defs>

  <!-- grinder body -->
  <rect x="58" y="70" width="84" height="86" rx="8" fill="url(#metalBody)"/>
  <!-- ridge lines on body -->
  <g stroke="#3a3730" stroke-width="1.2" opacity="0.4">
    <line x1="58" y1="90" x2="142" y2="90"/>
    <line x1="58" y1="108" x2="142" y2="108"/>
    <line x1="58" y1="126" x2="142" y2="126"/>
    <line x1="58" y1="144" x2="142" y2="144"/>
  </g>

  <!-- lid -->
  <ellipse cx="100" cy="68" rx="42" ry="14" fill="url(#metalTop)"/>
  <ellipse cx="100" cy="64" rx="42" ry="14" fill="url(#metalTop)"/>

  <!-- grinder teeth suggestion -->
  <g fill="#5c5644" opacity="0.7">
    <circle cx="82" cy="60" r="2.6"/>
    <circle cx="100" cy="56" r="2.6"/>
    <circle cx="118" cy="60" r="2.6"/>
    <circle cx="90" cy="68" r="2.6"/>
    <circle cx="110" cy="68" r="2.6"/>
    <circle cx="100" cy="72" r="2.6"/>
  </g>

  <!-- base foot -->
  <ellipse cx="100" cy="156" rx="42" ry="10" fill="#2c2a24"/>

  <!-- shine -->
  <rect x="66" y="76" width="6" height="72" rx="3" fill="#f0ead2" opacity="0.4"/>
</svg>
